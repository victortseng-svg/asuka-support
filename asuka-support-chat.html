async function callAI(question) {
var messages = [{role: 'system', content: AI_SYSTEM_PROMPT}];
var histSlice = chatHistory.slice(-MAX_HISTORY);
histSlice.forEach(function(m){ messages.push(m); });
messages.push({role: 'user', content: question});
var resp = await fetch(GAS_PROXY_URL, {
method: 'POST',
headers: {'Content-Type': 'text/plain'},
body: JSON.stringify({messages: messages})
});
var data = await resp.json();
if (data.candidates && data.candidates[0] && data.candidates[0].content &&
data.candidates[0].content.parts && data.candidates[0].content.parts[0]) {
return data.candidates[0].content.parts[0].text;
}
return '\u6292\u6B49\uFF0CAI \u66AB\u6642\u7121\u6CD5\u56DE\u61C9\uFF0C\u8ACB\u53C3\u8003\u4E0B\u65B9\u77E5\u8B58\u5EAB\u641C\u5C0B\u7D50\u679C\u3002';
}

var chatMessages = document.getElementById("chatMessages");
var userInput = document.getElementById("userInput");

window.onload = function() {
appendBotMsg('\u4F60\u597D\uFF01\u6211\u662F\u98DB\u9CE5\u6280\u8853\u5BA2\u670D\u52A9\u624B \uD83D\uDEE0\uFE0F\n\n\u8ACB\u7528\u53E3\u8A9E\u63CF\u8FF0\u4F60\u9047\u5230\u7684\u554F\u984C\uFF0C\u6211\u6703\u7528 AI \u5E6B\u4F60\u56DE\u7B54\uFF0C\u4E26\u627E\u5230\u6700\u76F8\u95DC\u7684\u8AAA\u660E\u9801\u9762\u3002',
['\u5F37\u5236\u6A94\u600E\u9EBC\u8A2D\u5B9A\uFF1F','\u74B0\u666F\u756B\u9762\u6709\u9ED1\u5F71','\u5C0E\u822A\u738BAPK\u4E0B\u8F09','OTA\u600E\u9EBC\u7528\uFF1F']);
};

function handleKey(e) {
if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
}

function autoResize(el) {
el.style.height = "auto";
el.style.height = Math.min(el.scrollHeight, 100) + "px";
}

async function sendMessage() {
var text = userInput.value.trim();
if (!text) return;
appendUserMsg(text);
userInput.value = "";
userInput.style.height = "auto";
chatHistory.push({role: 'user', content: text});
var typingEl = appendTyping();
var kbResults = multiSearch(text);
try {
var aiAnswer = await callAI(text);
typingEl.remove();
chatHistory.push({role: 'assistant', content: aiAnswer});
if (chatHistory.length > MAX_HISTORY * 2) chatHistory = chatHistory.slice(-MAX_HISTORY);
renderAI(aiAnswer, kbResults);
} catch(err) {
console.error('AI error:', err);
chatHistory.pop();
typingEl.remove();
renderKB(kbResults, text);
}
scrollBot();
}

function appendUserMsg(text) {
var div = document.createElement("div");
div.className = "msg user";
div.innerHTML = '<div class="bubble">' + esc(text) + '</div>';
chatMessages.appendChild(div);
scrollBot();
}

function appendBotMsg(text, suggestions) {
suggestions = suggestions || [];
var div = document.createElement("div");
div.className = "msg bot";
var html = '<div class="bubble">' + esc(text).replace(/\n/g,"<br>") + '</div>';
if (suggestions.length) {
html += '<div class="suggestions">' + suggestions.map(function(s){
return '<button class="suggestion-btn" onclick="quickSend(this)">' + esc(s) + '</button>';
}).join("") + '</div>';
}
div.innerHTML = html;
chatMessages.appendChild(div);
scrollBot();
return div;
}

function appendTyping() {
var div = document.createElement("div");
div.className = "msg bot";
div.innerHTML = '<div class="typing-dot"><span></span><span></span><span></span></div>';
chatMessages.appendChild(div);
scrollBot();
return div;
}

var descHtml = esc(item.desc).replace('ï¼è¥é é¢æªèªåå®ä½ï¼è«æ Ctrl+F æå°ç¸éæ¨é¡ï¼', '<span style="color:#1e293b;font-weight:600;">ï¼è¥é é¢æªèªåå®ä½ï¼è«æ Ctrl+F æå°ç¸éæ¨é¡ï¼</span>');

'<a class="dual-link dual-link2" href="' + esc(item.url2) + '" target="_blank" rel="noopener">' + svgIcon + ' \u7426\u68EE\u5C0D\u8A71\u8A18\u9304</a>' +
'</div>' +
'</div>';

function linkify(text) {
return text.replace(/(https?:\/\/[^\s<"]+)/g, function(url) {
var label = url.replace('https://sites.google.com/asuka-mobile-tv.com/asuka-can-setting/', '');
return '<a href="' + url + '" target="_blank" style="color:#1a56db;text-decoration:underline;word-break:break-all;">' + label + '</a>';
});
}
function renderAI(aiAnswer, results) {
var div = document.createElement("div");
div.className = "msg bot";
var html = '<div class="bubble">' + linkify(esc(aiAnswer)).replace(/\n/g,"<br>") + '</div>';
if (results.length > 0) {
html += '<div style="font-size:11px;color:#94a3b8;margin-top:10px;margin-bottom:4px;">&#x1F4DA; \u76F8\u95DC\u8AAA\u660E\u9801\u9762\uFF1A</div>' +
'<div class="results-list">' + results.map(cardHtml).join("") + '</div>';
}
div.innerHTML = html;
chatMessages.appendChild(div);
}

function renderKB(results, query) {
var div = document.createElement("div");
div.className = "msg bot";
if (!results.length) {
div.innerHTML = '<div class="bubble">\u627E\u4E0D\u5230\u300C' + esc(query) + '\u300D\u7684\u76F8\u95DC\u8AAA\u660E \uD83D\uDE14<br><br>\u5EFA\u8B70\u63DB\u500B\u95DC\u9375\u5B57\u518D\u8A66\u8A66\uFF0C\u6216\u76F4\u63A5\u806F\u7D61 FAE \u5DE5\u7A0B\u5E2B\u5354\u52A9\u3002</div>' +
'<div class="no-result">\uD83D\uDCA1 \u53EF\u4EE5\u8A66\u8A66\uFF1A<br>\u2022 \u63CF\u8FF0\u5177\u9AD4\u75C7\u72C0\uFF08\u4F8B\u5982\u300C\u9ED1\u756B\u9762\u300D\u300C\u7121\u8A0A\u865F\u300D\uFF09<br>\u2022 \u4F7F\u7528\u529F\u80FD\u540D\u7A31\uFF08\u4F8B\u5982\u300C\u8ECA\u901F\u300D\u300C\u5012\u8ECA\u300D\u300C\u65B9\u5411\u76E4\u300D\uFF09<br>\u2022 \u4F7F\u7528\u578B\u865F\u6216\u8ECA\u6B3E\u540D\u7A31</div>';
} else {
var label = results.length === 1 ? "\u627E\u5230 1 \u500B\u76F8\u95DC\u8AAA\u660E" : ("\u627E\u5230 " + results.length + " \u500B\u76F8\u95DC\u8AAA\u660E");
div.innerHTML = '<div class="bubble">' + label + '\uFF0C\u9EDE\u64CA\u9023\u7D50\u67E5\u770B\u8A73\u7D30\u8AAA\u660E\uFF1A</div>' +
'<div class="results-list">' + results.map(cardHtml).join("") + '</div>';
}
chatMessages.appendChild(div);
}

function quickSend(btn) { userInput.value = btn.textContent; sendMessage(); }
function scrollBot() { chatMessages.scrollTop = chatMessages.scrollHeight; }
function esc(str) { if (!str) return ''; return str.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

function clearChat() {
chatMessages.innerHTML = '';
userInput.value = '';
userInput.style.height = 'auto';
chatHistory = [];
appendBotMsg('\u5C0D\u8A71\u5DF2\u6E05\u9664 \uD83D\uDDD1\uFE0F\n\n\u8ACB\u7E7C\u7E8C\u8F38\u5165\u4F60\u7684\u554F\u984C\u3002',
['\u5F37\u5236\u6A94\u600E\u9EBC\u8A2D\u5B9A\uFF1F','\u74B0\u666F\u756B\u9762\u6709\u9ED1\u5F71','\u5C0E\u822A\u738BAPK\u4E0B\u8F09','OTA\u600E\u9EBC\u7528\uFF1F']);
}

var FEEDBACK_API = 'https://script.google.com/macros/s/AKfycby7DtvaCSibzRmPYoGjBeVyVS5lXIJE1btBEX3hui_duuk9A9hPvXFMEgId0mIOK5Vm/exec';

function toggleFeedback() {
var body = document.getElementById('feedbackBody');
var toggle = document.getElementById('feedbackToggle');
var isOpen = body.classList.contains('open');
body.classList.toggle('open', !isOpen);
toggle.classList.toggle('open', !isOpen);
}

function submitFeedback() {
var q = document.getElementById('fbQuestion').value.trim();
var a = document.getElementById('fbAnswer').value.trim();
if (!q || !a) { alert('\u8ACB\u586B\u5BEB\u554F\u984C\u8207\u7B54\u6848\u4F4D\u7F6E'); return; }
var btn = document.querySelector('.fb-submit-btn');
btn.textContent = '\u63D0\u4EA4\u4E2D...'; btn.disabled = true;
fetch(FEEDBACK_API, {method:'POST',mode:'no-cors',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:q,answer:a})})
.then(function(){
document.getElementById('fbQuestion').value = '';
document.getElementById('fbAnswer').value = '';
var suc = document.getElementById('fbSuccess');
suc.classList.add('show');
setTimeout(function(){ suc.classList.remove('show'); }, 4000);
btn.textContent = '\u63D0\u4EA4\u8A13\u7DF4\u8CC7\u6599'; btn.disabled = false;
})
.catch(function(){
alert('\u63D0\u4EA4\u5931\u6557\uFF0C\u8ACB\u78BA\u8A8D\u7DB2\u8DEF\u9023\u7DDA\u5F8C\u518D\u8A66');
btn.textContent = '\u63D0\u4EA4\u8A13\u7DF4\u8CC7\u6599'; btn.disabled = false;
});
}

function multiSearch(query) {
var results = fuse.search(query, {limit: 3});
if (results.length < 1) {
var tokens = query.split(/[\s\u3000\uff0c\u3002\uff1f\uff01\u3001\uff0c]+/).filter(function(t){ return t.length >= 2 && t.length <= 10; });
var seen = {};
results.forEach(function(r){ seen[r.item.title] = true; });
tokens.forEach(function(token) {
if (results.length >= 3) return;
var tr = fuse.search(token, {limit: 3});
tr.forEach(function(r) {
if (!seen[r.item.title] && results.length < 3) {
seen[r.item.title] = true;
results.push(r);
}
});
});
}
return results.slice(0, 3);
}
