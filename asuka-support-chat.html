<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asuka 技術客服助手</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/fuse.js/7.0.0/fuse.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
      background: #f0f2f5;
      display: flex; align-items: flex-start; justify-content: center;
      min-height: 100dvh; min-height: 100vh;
      padding: 16px; overflow-y: auto;
    }
    .chat-container {
      width: 100%; max-width: 680px; background: #fff;
      border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.10);
      display: flex; flex-direction: column; overflow: hidden; margin-bottom: 0;
    }
    .chat-header {
      background: linear-gradient(135deg, #1a56db, #1e429f);
      color: #fff; padding: 14px 18px;
      display: flex; align-items: center; gap: 12px; flex-shrink: 0;
    }
    .chat-header .icon {
      width: 38px; height: 38px; background: rgba(255,255,255,0.2);
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      font-size: 18px; flex-shrink: 0;
    }
    .chat-header .header-text { flex: 1; min-width: 0; }
    .chat-header h1 { font-size: 15px; font-weight: 700; }
    .chat-header p  { font-size: 11px; opacity: 0.8; margin-top: 2px; }
    .clear-btn {
      background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3);
      border-radius: 8px; color: #fff; cursor: pointer;
      padding: 6px 10px; font-size: 12px;
      display: flex; align-items: center; gap: 4px;
      flex-shrink: 0; transition: background 0.15s; white-space: nowrap;
    }
    .clear-btn:hover { background: rgba(255,255,255,0.25); }
    .clear-btn svg { width: 13px; height: 13px; fill: #fff; }
    .chat-messages {
      flex: 1; overflow-y: auto; padding: 16px;
      display: flex; flex-direction: column; gap: 14px;
      -webkit-overflow-scrolling: touch; min-height: 260px; max-height: 420px;
    }
    .msg { display: flex; flex-direction: column; max-width: 92%; }
    .msg.bot  { align-self: flex-start; }
    .msg.user { align-self: flex-end; }
    .msg .bubble {
      padding: 12px 16px; border-radius: 12px;
      font-size: 14px; line-height: 1.6;
    }
    .msg.bot  .bubble { background: #f1f5ff; color: #1e293b; border-bottom-left-radius: 4px; }
    .msg.user .bubble { background: #1a56db; color: #fff; border-bottom-right-radius: 4px; }
    .results-list { display: flex; flex-direction: column; gap: 10px; margin-top: 6px; }
    .result-card {
      background: #fff; border: 1px solid #dde4f5;
      border-radius: 10px; padding: 12px 14px;
      text-decoration: none; display: block;
      transition: box-shadow 0.2s, border-color 0.2s; color: inherit;
    }
    .result-card:hover { box-shadow: 0 2px 12px rgba(26,86,219,0.12); border-color: #1a56db; }
    .result-card.two-btn { cursor: default; }
    .result-card.two-btn:hover { box-shadow: 0 2px 8px rgba(26,86,219,0.07); border-color: #c7d7f8; }
    .result-card .rank {
      display: inline-block; background: #1a56db; color: #fff;
      font-size: 10px; font-weight: 700; border-radius: 4px;
      padding: 1px 6px; margin-bottom: 6px;
    }
    .result-card .title { font-size: 14px; font-weight: 600; color: #1a56db; margin-bottom: 4px; }
    .result-card .desc {
      font-size: 12px; color: #64748b; line-height: 1.5;
    }
    .result-card .link-hint {
      font-size: 11px; color: #94a3b8; margin-top: 6px;
      display: flex; align-items: center; gap: 4px;
    }
    /* 雙按鈕 */
    .card-buttons {
      display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap;
    }
    .card-btn {
      flex: 1; min-width: 120px; padding: 8px 12px; border-radius: 7px;
      font-size: 12px; font-weight: 600; text-decoration: none;
      text-align: center; display: inline-flex; align-items: center;
      justify-content: center; gap: 5px;
      transition: opacity 0.15s, transform 0.1s;
    }
    .card-btn:hover  { opacity: 0.88; }
    .card-btn:active { transform: scale(0.97); }
    .btn-asuka { background: #1a56db; color: #fff; }
    .btn-chat  { background: #f0fdf4; color: #166534; border: 1px solid #86efac; }
    .no-result {
      background: #fff8f0; border: 1px solid #ffd6a0;
      border-radius: 10px; padding: 12px 14px;
      font-size: 13px; color: #92400e;
    }
    /* ── 車款查詢雙按鈕 ── */
    .car-query-btns { display: flex; gap: 10px; margin-top: 8px; flex-wrap: wrap; }
    .car-btn {
      flex: 1; min-width: 145px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 13px 12px; border-radius: 10px; text-decoration: none;
      font-size: 13px; font-weight: 700; text-align: center;
      transition: box-shadow 0.2s, transform 0.1s; line-height: 1.5;
    }
    .car-btn:hover { box-shadow: 0 4px 14px rgba(0,0,0,0.15); transform: translateY(-1px); }
    .car-btn small { font-size: 11px; font-weight: 400; margin-top: 3px; opacity: 0.8; display: block; }
    .car-btn-asuka  { background: #eff6ff; border: 2px solid #1a56db; color: #1a56db; }
    .car-btn-qisen  { background: #fff8f0; border: 2px solid #d97706; color: #92400e; }
    .car-btn-install{ background: #f0fdf4; border: 2px solid #16a34a; color: #166534; }

    .suggestions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .suggestion-btn {
      background: #f1f5ff; border: 1px solid #c7d7f8;
      border-radius: 20px; padding: 6px 14px; font-size: 12px;
      color: #1a56db; cursor: pointer; transition: background 0.15s;
    }
    .suggestion-btn:hover { background: #dbeafe; }
    .chat-input-area { border-top: 1px solid #e9edf5; padding: 14px 16px; background: #fff; }
    .input-row { display: flex; gap: 10px; align-items: flex-end; }
    .input-row textarea {
      flex: 1; border: 1px solid #d1d9f0; border-radius: 10px;
      padding: 10px 14px; font-size: 14px; font-family: inherit;
      resize: none; outline: none; line-height: 1.5; max-height: 100px;
      transition: border-color 0.2s;
    }
    .input-row textarea:focus { border-color: #1a56db; }
    .input-row textarea::placeholder { color: #aab4cc; }
    .send-btn {
      width: 42px; height: 42px; background: #1a56db;
      border: none; border-radius: 10px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; transition: background 0.15s, transform 0.1s;
    }
    .send-btn:hover  { background: #1e429f; }
    .send-btn:active { transform: scale(0.95); }
    .send-btn svg { width: 18px; height: 18px; fill: #fff; }
    .hint-text { font-size: 11px; color: #aab4cc; margin-top: 6px; text-align: center; }
    .typing-dot {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 10px 14px; background: #f1f5ff;
      border-radius: 12px; border-bottom-left-radius: 4px;
    }
    .typing-dot span {
      width: 7px; height: 7px; background: #93acd8;
      border-radius: 50%; animation: bounce 1.2s infinite;
    }
    .typing-dot span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); }
      40% { transform: translateY(-6px); }
    }
    @media (max-width: 600px) {
      body { padding: 0; }
      .chat-container { border-radius: 0; }
      .chat-messages { padding: 12px; min-height: 220px; max-height: 340px; }
      .chat-header { padding: 12px 14px; }
      .hint-text { display: none; }
      .card-buttons { flex-direction: column; }
      .card-btn { min-width: unset; }
    }
    .feedback-panel { border-top: 2px solid #f0f2f5; background: #fff; flex-shrink: 0; }
    .feedback-header {
      background: #f8fafc; border-bottom: 1px solid #e2e8f0;
      padding: 14px 18px; display: flex; align-items: center;
      justify-content: space-between; cursor: pointer; user-select: none;
    }
    .feedback-header:hover { background: #f1f5f9; }
    .feedback-header-left { display: flex; align-items: center; gap: 10px; }
    .feedback-header-icon {
      width: 34px; height: 34px;
      background: linear-gradient(135deg, #f59e0b, #d97706);
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      font-size: 16px; flex-shrink: 0;
    }
    .feedback-header h2 { font-size: 14px; font-weight: 700; color: #1e293b; }
    .feedback-header p  { font-size: 11px; color: #64748b; margin-top: 2px; }
    .feedback-toggle {
      width: 28px; height: 28px; background: #e2e8f0;
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      transition: transform 0.2s; flex-shrink: 0;
    }
    .feedback-toggle svg { width: 14px; height: 14px; fill: #64748b; }
    .feedback-toggle.open { transform: rotate(180deg); }
    .feedback-body { padding: 16px 18px; display: none; }
    .feedback-body.open { display: block; }
    .feedback-count-badge {
      background: #f59e0b; color: #fff; font-size: 11px; font-weight: 700;
      border-radius: 10px; padding: 2px 8px; display: none;
    }
    .feedback-count-badge.visible { display: inline-block; }
    .fb-label { font-size: 12px; font-weight: 600; color: #374151; margin-bottom: 5px; }
    .fb-input {
      width: 100%; border: 1px solid #d1d9f0; border-radius: 8px;
      padding: 9px 12px; font-size: 13px; font-family: inherit;
      outline: none; resize: vertical; transition: border-color 0.2s; min-height: 40px;
    }
    .fb-input:focus { border-color: #f59e0b; }
    .fb-row { margin-bottom: 12px; }
    .fb-submit-btn {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #fff; border: none; border-radius: 8px;
      padding: 9px 20px; font-size: 13px; font-weight: 600;
      cursor: pointer; transition: opacity 0.15s; font-family: inherit;
    }
    .fb-submit-btn:hover { opacity: 0.9; }
    .fb-success {
      display: none; background: #f0fdf4; border: 1px solid #86efac;
      border-radius: 8px; padding: 10px 14px; font-size: 13px;
      color: #166534; margin-top: 10px;
    }
    .fb-success.show { display: block; }
    .fb-empty { font-size: 12px; color: #94a3b8; text-align: center; padding: 12px 0; }
  </style>
</head>
<body>
<div class="chat-container">
  <div class="chat-header">
    <div class="icon">🔧</div>
    <div class="header-text">
      <h1>Asuka 技術客服助手</h1>
      <p>輸入問題，我幫你找到最相關的說明頁面</p>
    </div>
    <button class="clear-btn" onclick="clearChat()" title="清除對話">
      <svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
      清除
    </button>
  </div>
  <div class="chat-messages" id="chatMessages"></div>
  <div class="chat-input-area">
    <div class="input-row">
      <textarea id="userInput" rows="1"
        placeholder="請輸入你的問題，例如：CAN bus 訊號沒有反應怎麼辦？"
        onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
      <button class="send-btn" onclick="sendMessage()" title="送出">
        <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </div>
    <p class="hint-text">按 Enter 送出，Shift+Enter 換行</p>
  </div>
  <div class="feedback-panel">
    <div class="feedback-header" onclick="toggleFeedback()">
      <div class="feedback-header-left">
        <div class="feedback-header-icon">📝</div>
        <div>
          <h2>找不到答案？幫助我學習 <span class="feedback-count-badge" id="feedbackBadge"></span></h2>
          <p>填寫問題與答案位置，讓管理員更新知識庫</p>
        </div>
      </div>
      <div class="feedback-toggle" id="feedbackToggle">
        <svg viewBox="0 0 24 24"><path d="M7 10l5 5 5-5z"/></svg>
      </div>
    </div>
    <div class="feedback-body" id="feedbackBody">
      <div class="fb-row">
        <div class="fb-label">📌 你的問題（使用者會怎麼問？）</div>
        <textarea class="fb-input" id="fbQuestion" rows="2" placeholder="例如：Ford Kuga 2016年可以安裝嗎？"></textarea>
      </div>
      <div class="fb-row">
      <div class="fb-label">🔗 客服平台網址（選填，純貼網址）</div>
      <textarea class="fb-input" id="fbUrl" rows="2" placeholder="例如：https://sites.google.com/asuka-mobile-tv.com/asuka-can-setting/ford"></textarea>
    </div>
    <div class="fb-row">
      <div class="fb-label">📝 文字說明（選填，純文字）</div>
      <textarea class="fb-input" id="fbDesc" rows="2" placeholder="例如：可安裝，適用 2016~2020 年款，注意高低配差異"></textarea>
    </div>
      <button class="fb-submit-btn" onclick="submitFeedback()">提交訓練資料</button>
      <div class="fb-success" id="fbSuccess">✅ 已記錄！感謝你的貢獻，管理員會定期更新知識庫。</div>
      <div style="font-size:11px;color:#94a3b8;margin-top:10px;text-align:center;">
        提交後會自動記錄到管理員的 Google 試算表 📊
      </div>
    </div>
  </div>
</div>
<script>
/* 知識庫 最後更新：2026-06-23 */
const KB = [
  {title:"飛鳥客戶服務中心 首頁",url:"https://sites.google.com/asuka-mobile-tv.com/asuka-can-setting/首頁",desc:"飛鳥主機銷售及安裝資訊服務平台首頁，各位在安裝飛鳥主機或配件時若有安裝及設定上的問題，可透過此平台取得相關資料。",keywords:"首頁 飛鳥 主機 安裝 資訊 服務 平台 入口"},
  {title:"常見問題 - 導航王設定與問題排除",url:"https://sites.google.com/asuka-mobile-tv.com/asuka-can-setting/其他分類/常見問題#h.5k4aig1pug17",desc:"導航王相關問題總覽：語音播報沒有聲音、輸入地址沒有縣市可選、混音設定、手寫功能無法使用、序號不見、圖資更新失敗、聲控靈敏度、大貨車模式、定位問題等。",keywords:"導航 導航王 語音播報 混音 地址 縣市 手寫 序號 圖資 更新 聲控 大貨車 定位 GPS 無聲"},
  {title:"導航王沒有語音播報，如何設定？",url:"https://sites.google.com/asuka-mobile-tv.com/asuka-can-setting/其他分類/常見問題#h.6k2ysmcjzk44",desc:"依序確認：1.車機導航混音是否開啟 2.導航是否靜音 3.語音設定導航音量是否開啟 4.更新到最新版本並恢復導航預設值。",keywords:"導航王 語音 播報 靜音 混音 音量 沒有聲音 無聲"},
  {title:"導航王輸入地址時沒有縣市可選",url:"https://sites.google.com/asuka-mobile-tv.com/asuka-can-setting/其他分類/常見問題#h.gl8wowml92ws",desc:"解法：先離開導航王，到檔案總管刪除指定NavikingMap資料夾，再重新打開導航王連網下載圖資。",keywords:"導航王 地址 縣市 選不到 圖資 下載 NavikingMap"},
  {title:"導航王混音後播報音量不夠大聲",url:"https://sites.google.com/asuka-mobile-tv.com/asuka-can-setting/其他分類/常見問題#h.dj2rijblpesh",desc:"到導航王設定→語音設定→導航音量調整，並勾選「降低其他app播報音量」，可讓導航播報聲音更清晰。",keywords:"導航王 混音 音量 播報 不夠大聲 聲音小"},
  {title:"導航王序號不見了怎麼辦？",url:"https://sites.google.com/asuka-mobile-tv.com/asuka-can-setting/其他分類/常見問題#h.n6hoqe7dfx64",desc:"在導航王內→電話搜尋輸入 288356630，再回到版本資訊頁，即會顯示開通資料。",keywords:"導航王 序號 不見 消失 開通"},
  {title:"CK主機偶發導航無法定位的處理方法",url:"https://sites.google.com/asuka-mobile-tv.com/asuka-can-setting/其他分類/常見問題#h.gobiac4ezs6l",desc:"確認主機後方風扇接電是否接好、聲音功放開關是否開啟（預設開）。風扇若沒打開，機內過熱時會影響GPS定位。",keywords:"CK 導航 定位 失敗 GPS 過熱 風扇 功放"},
  {title:"常見問題 - 網路 / WiFi / 手機熱點問題",url:"https://sites.google.com/asuka-mobile-tv.com/asuka-can-setting/其他分類/常見問題#h.to3lgn3c0uyv",desc:"網路相關問題：iPhone熱點不穩定改善方法、WiFi連線後無法上網、車機找不到手機熱點（5GHz頻段）、WiFi自動關閉原因、SIM卡無法上網。",keywords:"WiFi 熱點 網路 iPhone 連線 上網 5GHz 2.4GHz 頻段 不穩定 關閉"},
  {title:"iPhone 熱點不穩定如何改善？",url:"https://sites.google.com/asuka-mobile-tv.com/asuka-can-setting/其他分類/常見問題#h.mm0iihsxuolt",desc:"iPhone 12後機型：開啟熱點最大相容性設定。舊款iPhone另有改善偏方。此問題根本解決需靠Apple更新熱點連線穩定性。",keywords:"iPhone 熱點 不穩定 最大相容性 連線 斷線 WiFi 熱點斷"},
  {title:"WiFi連線後仍然無法上網",url:"https://sites.google.com/asuka-mobile-tv.com/asuka-can-setting/其他分類/常見問題#h.lqehnf99apmn",desc:"可能原因是裝置系統時間與實際時間差距太大，請到設定手動將系統時間調整到正確時間再試。",keywords:"WiFi 上網 無法 系統時間 連線 網路 顯示連線但不能用"},
  {title:"車機找不到手機熱點（頻段問題）",url:"https://sites.google.com/asuka-mobile-tv.com/asuka-can-setting/其他分類/常見問題#h.o40s1oubpml9",desc:"車機找不到手機熱點，請確認手機熱點頻段，設定為2.4GHz或雙頻。BM-2、BM-3、PN-203主機不支援5.0GHz。",keywords:"熱點 找不到 掃不到 頻段 5GHz 2.4GHz 雙頻 BM-2 BM-3"},

  {title:"插入SIM卡後無法上網",url:"https://sites.google.com/asuka-mobile-tv.com/asuka-can-setting/其他分類/常見問題#h.8k68u3o75s56",desc:"SIM卡有讀到但無法上網，請確認SIM卡是否設定了PIN碼。需先用手機關閉SIM PIN後再插入車機使用。",keywords:"SIM卡 上網 無法 PIN碼 PIN 插卡 4G 讀到但不能用"},

  div2.innerHTML = '<div class="bubble">找不到對應車廠資料 🔍<br>請點下方連結，在資料庫中以 Ctrl+F 搜尋您的車款：</div><div class="car-query-btns"><a class="car-btn car-btn-asuka" href="' + CAR_QUERY_BASE + '" target="_blank" rel="noopener">🔍 車款升級查詢資料庫<small>自行搜尋 Ctrl+F</small></a></div>';
  chatMessages.appendChild(div2);
}
const chatMessages = document.getElementById("chatMessages");
const userInput    = document.getElementById("userInput");

window.onload = () => {
  appendBotMessage("你好！我是飛鳥技術客服助手 👋\n\n請用口語描述你遇到的問題，我會幫你在客服平台找到最相關的說明頁面（最多3個結果）。",
    ["環景黑影","強制檔","導航王APK","OTA怎麼用"]);
};

function handleKey(e) {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
}
function autoResize(el) {
  el.style.height = "auto";
  el.style.height = Math.min(el.scrollHeight, 100) + "px";
}
function sendMessage() {
  const text = userInput.value.trim();
  if (!text) return;
  fetch(FEEDBACK_API,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/json'},body:JSON.stringify({type:'log',query:text})}).catch(()=>{});
  appendUserMessage(text);
  userInput.value = ""; userInput.style.height = "auto";
  const typingEl = appendTyping();
  setTimeout(() => {
    typingEl.remove();
    const carBrand = detectCarBrand(text);
    if (carBrand) {
      renderCarQueryResult(carBrand);
    } else if (CAR_KEYWORDS.test(text)) {
      renderCarQueryFallback();
    } else {
      renderResults(fuse.search(text, {limit: 3}), text);
    }
    scrollToBottom();
  }, 600);
}
function appendUserMessage(text) {
  const div = document.createElement("div");
  div.className = "msg user";
  div.innerHTML = '<div class="bubble">' + escHtml(text) + '</div>';
  chatMessages.appendChild(div); scrollToBottom();
}
function appendBotMessage(text, suggestions) {
  suggestions = suggestions || [];
  const div = document.createElement("div");
  div.className = "msg bot";
  let html = '<div class="bubble">' + escHtml(text).replace(/\n/g,"<br>") + '</div>';
  if (suggestions.length) {
    html += '<div class="suggestions">' +
      suggestions.map(s => '<button class="suggestion-btn" onclick="quickSend(this)">' + escHtml(s) + '</button>').join("") +
    '</div>';
  }
  div.innerHTML = html; chatMessages.appendChild(div); scrollToBottom();
  return div;
}
function appendTyping() {
  const div = document.createElement("div");
  div.className = "msg bot";
  div.innerHTML = '<div class="typing-dot"><span></span><span></span><span></span></div>';
  chatMessages.appendChild(div); scrollToBottom();
  return div;
}
function renderResults(results, query) {
  const div = document.createElement("div");
  div.className = "msg bot";
  if (!results.length) {
    div.innerHTML =
      '<div class="bubble">找不到「' + escHtml(query) + '」的相關說明 😔<br><br>建議換個關鍵字再試試，或直接聯絡 FAE 工程師協助。</div>' +
      '<div class="no-result">💡 可以試試：<br>• 描述具體症狀（例如「黑畫面」「無訊號」）<br>• 使用功能名稱（例如「車速」「倒車」「方向盤」）<br>• 使用型號或車款名稱</div>';
  } else {
    const label = results.length === 1 ? "找到 1 個相關說明" : "找到 " + results.length + " 個相關說明";
    const rankLabels = ["最相關","次相關","參考"];
    const cards = results.map(function(r, i) { const item = r.item;
  var isUrl = item.url && item.url.indexOf("http") === 0;
  var title = item.question || item.title || "";
  var desc = item.description || item.desc || item.answer || "";
  var dq = String.fromCharCode(34);
  var inner = "<div class=" + dq + "result-card" + dq + "><div class=" + dq + "title" + dq + ">" + title + "</div><div class=" + dq + "desc" + dq + ">" + desc + "</div></div>";
  if (isUrl) return "<a href=" + dq + item.url + dq + " target=" + dq + "_blank" + dq + " rel=" + dq + "noopener" + dq + ">" + inner + "</a>";
  return "<div>" + inner + "</div>";
}).join("");
    div.innerHTML = '<div class="bubble">' + label + '，點擊連結查看詳細說明：</div><div class="results-list">' + cards + '</div>';
  }
  chatMessages.appendChild(div);
}
function quickSend(btn) { userInput.value = btn.textContent; sendMessage(); }
function scrollToBottom() { chatMessages.scrollTop = chatMessages.scrollHeight; }
function clearChat() {
  chatMessages.innerHTML = ''; userInput.value = ''; userInput.style.height = 'auto';
  appendBotMessage("對話已清除 🗑️\n\n請繼續輸入你的問題。",
    ["環景黑影","強制檔","導航王APK","OTA怎麼用"]);
}
/* dynamic top suggestions */
(function(){
  var _o=window.onload;
  window.onload=function(){
    if(_o)_o.call(this);
    window._loadTopSugg=function(t){
      if(!t||!t.length)return;
      var el=Array.from(document.querySelectorAll('.msg.bot .suggestions')).pop();
      if(el)el.innerHTML=t.map(function(s){return '<button class="suggestion-btn" onclick="quickSend(this)">'+escHtml(s)+'</button>';}).join('');
    };
    var sc=document.createElement('script');
    sc.src=FEEDBACK_API+'?callback=_loadTopSugg&t='+Date.now();
    sc.onerror=function(){};
    document.head.appendChild(sc);
  };
})();

function escHtml(str) {
  if (!str) return '';
  return str.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

const FEEDBACK_API = 'https://script.google.com/macros/s/AKfycbwnj7ltivmTIFXafZ5d5jwHuONHpoG-p3nlvC6kFk6fI7VZfYyVWhhbAk3OE8jVt9la/exec';
function toggleFeedback() {
  const body = document.getElementById('feedbackBody');
  const toggle = document.getElementById('feedbackToggle');
  const isOpen = body.classList.contains('open');
  body.classList.toggle('open', !isOpen); toggle.classList.toggle('open', !isOpen);
}
function submitFeedback() {
  const q    = document.getElementById('fbQuestion').value.trim();
  const url  = document.getElementById('fbUrl').value.trim();
  const desc = document.getElementById('fbDesc').value.trim();
  if (!q || (!url && !desc)) { alert('請填寫問題，並填入網址或文字說明至少一項'); return; }
  const submitBtn = document.querySelector('.fb-submit-btn');
  submitBtn.textContent = '提交中...'; submitBtn.disabled = true;
  fetch(FEEDBACK_API, {
    method:'POST', mode:'no-cors',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({question:q, url:url, desc:desc})
  }).then(() => {
    document.getElementById('fbQuestion').value = '';
    document.getElementById('fbUrl').value = '';
    document.getElementById('fbDesc').value = '';
    const suc = document.getElementById('fbSuccess');
    suc.classList.add('show'); setTimeout(() => suc.classList.remove('show'), 4000);
    submitBtn.textContent = '提交訓練資料'; submitBtn.disabled = false;
  }).catch(() => {
    alert('提交失敗，請確認網路連線後再試');
    submitBtn.textContent = '提交訓練資料'; submitBtn.disabled = false;
  });
}
</script>
